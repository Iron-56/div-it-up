<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Bank App</title>
		<script src="app.js" defer></script>
		<link rel="stylesheet" id="stylesheet" href="login.css">
	</head>
	<body>
		<div id="app">Loading...</div>
		
		<template id="login">
			<h1>Bank App</h1>
			<footer>
				<a href="/credits" onclick="onLinkClick(event)">CREDITS</a>
			</footer>
			<div id="login-container">
				<h2>LOGIN</h2>
				<form id="loginForm" action="javascript:login()">
					<label for="username">Username</label>
					<input id="username" name="user" type="text"> <br>
					<div id="loginError" hidden="true" role="alert"></div>
					<button>LOGIN</button>
				</form>
				<div class="or">OR</div>
				<h2>REGISTER</h2>
				<form id="registerForm" action="javascript:register()" method="POST">
					<label for="user">Username</label>
					<input id="user" name="user" type="text" maxlength="20" required> <br>
					<div id="userError" hidden="true" role="alert"></div>
					<label for="currency">Currency</label>
					<input id="currency" name="currency" type="text" value="$" maxlength="5" required> <br>
					<label for="description">Description</label>
					<input id="description" name="description" type="text" maxlength="100"> <br>
					<label for="balance">Current balance</label>
					<input id="balance" name="balance" type="number" value="0"><br>
					<button>REGISTER</button>
				</form>
			</div>
		</template>
		
		<template id="transaction-template">
			<div id="transaction-container">
				<h2>ADD TRANSACTION</h2>
				<form id="transaction-form">
					<label for="date">DATE</label>
					<input id="date" name="date" type="date" required> <br>
					<label for="object">OBJECT</label>
					<input id="object" name="object" type="text" required> <br>
					<label for="amount">AMOUNT</label>
					<input id="amount" name="amount" type="number" required> <br>
					<div id="button-container">
						<a id="transaction-cancel" href="/dashboard" onclick="onLinkClick(event)">CANCEL</a>
						<a id="transaction-ok" onclick="newTransaction()">OK</a>
					</div>
				</form>
			</div>
		</template>

		<template id="dashboard">
			<div id="dashboard-container">
				<header>
					<h1>Bank App</h1>
					<a href="/login" onclick="onLinkClick(event)">LOGOUT</a>
				</header>
				<section id="account">
					BALANCE <br> <span id="currency"></span> <span id="balance"></span>
				</section>
				<div id="transaction-header">
					<h2 id="description"></h2>
					<button id="add-transaction" onclick="navigate('/transactions')">ADD TRANSACTION</button>
				</div>
				<section id="transactions-section">
					<table>
						<thead>
							<tr>
								<th style="text-align: left">Date</th>
								<th style="text-align: left" colspan="3">Object</th>
								<th style="text-align: right">Amount</th>
							</tr>
							<tr>
								<td colspan="5"><hr></td>
							</tr>
						</thead>
						<tbody id="transactions"></tbody>
					</table>
				</section>
			</div>
			<footer>
				<a href="/credits" onclick="onLinkClick(event)">CREDITS</a>
			</footer>
		</template>

		<template id="transaction">
			<tr>
			  <td style="text-align: left"></td>

		</template>
